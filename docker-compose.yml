# Dokploy → Compose service. Set the variables below in Dokploy's "Environment" tab, then add the
# domain in the "Domains" tab pointing at service `app`, port 3000 (Traefik handles HTTPS).
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nextmed}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-nextmed}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:?SEED_DEFAULT_PASSWORD is required}
      RUN_SEED: ${RUN_SEED:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-claude-haiku-5-5}
    expose:
      - "3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-nextmed}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextmed} -d ${POSTGRES_DB:-nextmed}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
